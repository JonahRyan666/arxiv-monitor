# 每日实验文献日报配置。
# 优先级：环境变量 / GitHub Actions variables > 本文件 > 脚本内置默认值。
# 环境变量为空时视为未设置，因此 Actions 里只在仓库变量有值时才会覆盖这里。

arxiv_monitor:
  # arXiv API 分类。默认只看强关联和材料，避免纯理论分类灌进来。
  categories:
    - cond-mat.str-el
    - cond-mat.mtrl-sci

  # 标题+摘要的廉价预筛。* 是通配符。大小写不敏感。
  # 略宽于第一版，避免一天只剩个位数候选。
  keywords:
    - spin liquid
    - frustrat*
    - kagome
    - pyrochlore
    - triangular lattice
    - honeycomb
    - kitaev
    - multiferroic
    - magnetoelectric
    - ferroelectric
    - ferroelectric polarization
    - electric polarization
    - magnetodielectric
    - quantum spin ice
    - spin ice
    - quantum magnet
    - helimagnet*
    - spiral magnet
    - noncollinear
    - curie-weiss
    - spinon
    - valence bond
    - spin gap
    - QSL

  # 命中这些、且没有测量/样品证据时，预筛直接丢掉。
  theory_markers:
    - first-principles
    - first principles
    - DFT
    - density functional
    - ab initio
    - we propose a model
    - monte carlo
    - tensor network
    - DMRG

  # 有这些证据时，即使摘要里也出现 DFT / 模型，仍交给模型筛选。
  experiment_markers:
    - single crystal
    - polycrystal
    - polycrystalline
    - powder sample
    - crystal growth
    - were grown
    - was grown
    - grown by
    - grown from
    - synthesized
    - chemical vapor transport
    - CVT
    - solid-state reaction
    - solid state reaction
    - solid-state synthesis
    - high-pressure
    - high pressure
    - flux growth
    - flux-grown
    - flux method
    - magnetization
    - susceptibility
    - specific heat
    - heat capacity
    - neutron
    - muon
    - muSR
    - dielectric
    - polarization
    - MPMS
    - PPMS
    - SQUID
    - sintered

  max_lookback_days: 3
  max_papers_per_day: 10
  min_papers_per_day: 5
  screen_batch_size: 4
  screen_retries: 2
  # 关键词命中最多的这几篇才送给模型；其余留作未评分备选。
  screen_pool: 16
  max_authors_display: 3

  models:
    # 筛选用的指令模型。失败时依次尝试 fallback、legacy。
    screen: Qwen/Qwen3.6-27B
    fallback: Qwen/Qwen3.5-9B
    legacy: tencent/Hunyuan-MT-7B
