# 每日实验文献日报配置。
# 优先级：环境变量 / GitHub Actions variables > 本文件 > 脚本内置默认值。
# 环境变量为空时视为未设置，因此 Actions 里只在仓库变量有值时才会覆盖这里。

arxiv_monitor:
  # arXiv API 分类。默认只看强关联和材料，避免纯理论分类灌进来。
  categories:
    - cond-mat.str-el
    - cond-mat.mtrl-sci

  # 标题+摘要的廉价预筛 + 排序。* 是通配符，大小写不敏感。
  # 核心方向关键词：每命中一个 +4（标题里命中 +8）。
  # 下面 secondary / polar / negative / hard_negative 不写时用 digest_lib.py 里的默认列表；
  # 写成空列表 [] 表示关闭该组。
  keywords:
    - spin liquid
    - frustrat*
    - kagome
    - pyrochlore
    - triangular lattice
    - honeycomb
    - kitaev
    - spin ice
    - multiferroic
    - magnetoelectric
    - magnetodielectric
    - spin-driven polarization
    - polar magnet
    - shastry-sutherland
    - magnetization plateau
    - spinon
    - valence bond
    - QSL

  # 更宽的量子/块体磁性词（每个 +2）。论文至少要命中核心词、这组词或极化词之一才进候选池。
  secondary_keywords:
    - antiferromagnet*
    - ferrimagnet*
    - quantum magnet
    - magnetic order
    - long-range order
    - spin chain
    - spin ladder
    - dimer*
    - helimagnet*
    - helical
    - spiral magnet
    - cycloid*
    - chiral magnet
    - skyrmion*
    - noncollinear
    - noncoplanar
    - curie-weiss
    - spin gap
    - spin glass
    - magnon*
    - metamagnet*
    - spin-flop
    - spin reorientation
    - magnetostructural
    - magnetoelastic
    - neel
    - Ising
    - Heisenberg
    - Dzyaloshinskii
    - crystal field
    - local moment
    - rare-earth
    - iridate*
    - spin-orbit coupled
    - magnetic susceptibility
    - spin dynamics
    - spin wave
    - neutron scattering
    - neutron diffraction
    - musr
    - electron spin resonance
    - altermagnet*
    - van der waals magnet
    - haldane

  # 铁电/极化词：单独命中只 +1（纯铁电排后面）；和磁性词同时出现再 +4。
  polar_keywords:
    - ferroelectric
    - electric polarization
    - pyroelectric
    - dielectric
    - relaxor
    - polar

  # 应用/离题信号：每命中一个 -3（最多 -12）。
  negative_keywords:
    - thin film
    - epitaxial
    - heterostructure
    - sputter*
    - pulsed laser deposition
    - PLD
    - molecular beam
    - MBE
    - device
    - transistor
    - spintronic*
    - spin-orbit torque
    - terahertz emission
    - catalys*
    - photocatalys*
    - photoanode
    - photoelectrochemical
    - water splitting
    - hydrogen evolution
    - solar cell
    - photovoltaic*
    - battery
    - cathode
    - anode
    - electrolyte*
    - memristor*
    - synaptic
    - CMOS
    - machine learning
    - neural network
    - deep learning
    - dataset
    - graphene
    - moire
    - monolayer
    - superconduct*
    - qubit*
    - molecular dynamics
    - interatomic potential

  # 没有核心词时，命中这些直接判为离题，不进候选池。
  hard_negative_keywords:
    - photocatalys*
    - photoanode
    - photoelectrochemical
    - water splitting
    - hydrogen evolution
    - oxygen evolution
    - solar cell
    - photovoltaic*
    - battery
    - electrolyte*
    - lithium-ion
    - supercapacitor*
    - memristor*
    - synaptic
    - CMOS
    - qubit*
    - transmon

  # 命中这些、且没有测量/样品证据时，预筛直接丢掉。
  theory_markers:
    - first-principles
    - first principles
    - DFT
    - density functional
    - ab initio
    - we propose a model
    - monte carlo
    - tensor network
    - DMRG
    - exact diagonalization
    - mean-field
    - theory of
    - theoretical
    - we predict

  # 有这些证据时，即使摘要里也出现 DFT / 模型，仍交给模型筛选。
  experiment_markers:
    - single crystal
    - polycrystal
    - polycrystalline
    - powder sample
    - crystal growth
    - were grown
    - was grown
    - grown by
    - grown from
    - synthesized
    - chemical vapor transport
    - CVT
    - solid-state reaction
    - solid state reaction
    - solid-state synthesis
    - high-pressure
    - high pressure
    - flux growth
    - flux-grown
    - flux method
    - magnetization
    - susceptibility
    - specific heat
    - heat capacity
    - neutron
    - muon
    - muSR
    - dielectric
    - polarization
    - MPMS
    - PPMS
    - SQUID
    - sintered
    - floating zone
    - Bridgman
    - NMR
    - ESR
    - pyroelectric current
    - thermal conductivity
    - x-ray diffraction

  # 固定回看窗口（天）。arXiv API 要等论文公告后（提交后约 1–3.5 天）才能查到，
  # 所以每天都按完整窗口查询，靠 sent_ids 和筛选缓存去重，不再从上次成功时间开始。
  max_lookback_days: 6
  max_papers_per_day: 10
  min_papers_per_day: 5
  screen_batch_size: 4
  screen_retries: 2
  # 去掉已发送、已评分过的论文后，预筛得分最高的这几篇送模型（只给标题+摘要）；其余留作未评分备选。
  screen_pool: 36
  max_authors_display: 3

  models:
    # 筛选用的指令模型。失败时依次尝试 fallback、legacy。
    screen: Qwen/Qwen3.6-27B
    fallback: Qwen/Qwen3.5-9B
    legacy: tencent/Hunyuan-MT-7B
