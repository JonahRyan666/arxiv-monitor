name: Daily arXiv Report

on:
  schedule:
    - cron: '00 01 * * *'          # 每天北京时间 09:00
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run arXiv monitor
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}   # 如果需要翻译，请设置此 secret；若不需要可删除
          SILICONFLOW_MODEL: ${{ vars.SILICONFLOW_MODEL || 'deepseek-ai/DeepSeek-V4-Pro' }}
          PYTHONUNBUFFERED: "1"
          MAX_PAPERS_PER_RUN: "12"
          JPSJ_TARGET_PER_RUN: "8"
          SILICONFLOW_TIMEOUT: "30"
          SILICONFLOW_RETRIES: "1"
          TRANSLATION_VALIDATION_RETRIES: "2"
        run: |
          python arxiv_daily_report.py

      - name: Upload sent_papers.json (optional)
        uses: actions/upload-artifact@v4
        with:
          name: sent-papers
          path: sent_papers.json
